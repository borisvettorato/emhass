#template modified from: https://docs.docker.com/build/ci/github-actions/multi-platform/ & https://docs.github.com/en/actions/use-cases-and-examples/publishing-packages/publishing-docker-images
#builds from branch experimental-changes, for shadow-testing before merging into master
name: "Publish Docker experimental image"

on:
  push:
    branches:
      - experimental-changes
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            { target_arch: amd64, buildx: "linux/amd64", os_version: debian },
            { target_arch: aarch64, buildx: "linux/arm64", os_version: debian },
          ]
    steps:
      # Pull git repo and build each architecture image separately (with QEMU and Buildx)
      - name: lowercase repo
        run: |
          echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and save Docker image locally to check security of container packages
      - name: Build Docker image and cache
        id: cache
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform.buildx }}
          build-args: |
            TARGETARCH=${{ matrix.platform.target_arch }}
            os_version=${{ matrix.platform.os_version }}
          load: true
      # Extract a list of the installed Debian packages, export as artifact for vulnerability scanning with OSV
      - name: Export Debian package list
        run: mkdir OSV && docker run --rm --entrypoint '/bin/cat' ${{ steps.cache.outputs.imageid }} /var/lib/dpkg/status >> ./OSV/${{ matrix.platform.target_arch }}.status
      - name: Export Python package list
        run: docker run --rm --entrypoint '/bin/cat' ${{ steps.cache.outputs.imageid }} uv.lock >> ./OSV/${{ matrix.platform.target_arch }}.lock
      - name: Upload package list as digest
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.target_arch }}-packages
          path: ./OSV/*
          if-no-files-found: error
          retention-days: 1
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}

      # Build Docker image for pushing to registry
      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform.target_arch }}
          build-args: |
            TARGETARCH=${{ matrix.platform.target_arch }}
            os_version=${{ matrix.platform.os_version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }},push-by-digest=true,name-canonical=true,push=true
      # Export the build images as artifact for the next job of merging
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.platform.target_arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Google OSV-Scanner (check known vulnerabilities for Python & Debian packages )
  osv-scan:
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            { target_arch: amd64 },
            { target_arch: aarch64 },
          ]
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.1"
    with:
      download-artifact: "${{ matrix.platform.target_arch }}-packages"
      matrix-property: "${{ matrix.platform.target_arch }}-"
      fail-on-vuln: false
      scan-args: |-
        --lockfile=dpkg-status:./${{ matrix.platform.target_arch }}.status
        --lockfile=poetry.lock:./${{matrix.platform.target_arch }}.lock
    permissions:
      security-events: write
      contents: read
      actions: read

  # Merge platforms into images into a multi-platform image
  merge:
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      attestations: write
      id-token: write
    needs:
      - osv-scan
      - build
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: lowercase repo
        run: |
          echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=sha
            type=raw,value=experimental
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ steps.meta.outputs.version }}

      # Home Assistant Supervisor only offers an "Update" button on the
      # add-on's page when config.yml's version string actually changes -
      # image: (pull-based) add-ons like this one have no local Dockerfile,
      # so there's no "Rebuild" button either. Without this, a fixed
      # version: "experimental" string means Supervisor never notices a new
      # image was pushed to the same tag.
      #
      # The version string must exactly match a tag docker/metadata-action
      # actually publishes above (type=sha -> "sha-<short_sha>"), not an
      # invented "experimental-<short_sha>" tag that's never pushed - that
      # mismatch previously made Supervisor fail with "manifest unknown".
      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          short_sha="${GITHUB_SHA::7}"
          # The checkout at job start can be behind by the time we get here
          # (a manual push, or another run's own bump commit, may have
          # landed on the branch in the meantime), so a plain commit+push
          # can be rejected as non-fast-forward. Re-sync to the latest tip
          # and redo this trivial one-line edit fresh on each retry, rather
          # than rebasing a stale commit (which can itself conflict when two
          # runs bump the same version line at nearly the same time).
          for attempt in 1 2 3 4 5; do
            sed -i "s/^version: .*/version: sha-${short_sha}/" emhass-experimental/config.yml
            git add emhass-experimental/config.yml
            if git diff --cached --quiet; then
              echo "No version change to commit"
              break
            fi
            git commit -m "chore: bump emhass-experimental version to sha-${short_sha} [skip ci]"
            if git push origin HEAD:experimental-changes; then
              break
            fi
            echo "Push rejected (attempt ${attempt}), syncing to latest experimental-changes and retrying..."
            git fetch origin experimental-changes
            git reset --hard origin/experimental-changes
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push version bump after 5 attempts"
              exit 1
            fi
          done
