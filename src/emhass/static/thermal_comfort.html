<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thermal Comfort UI - Home Assistant Style</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ha-bg: #f5f7fa;
      --ha-card: #ffffff;
      --ha-border: #d8dee9;
      --ha-text: #1f2937;
      --ha-text-muted: #6b7280;
      --ha-primary: #03a9f4;
      --ha-primary-dark: #0288d1;
      --ha-success: #22c55e;
      --ha-warning: #f59e0b;
      --ha-danger: #ef4444;
      --ha-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      --ha-radius: 14px;
    }

    body {
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--ha-bg);
      color: var(--ha-text);
    }

    input, button, select {
      font: inherit;
    }

    button {
      transition: 0.18s ease;
    }

    button:hover {
      filter: brightness(0.98);
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      background: var(--ha-card);
      border-bottom: 1px solid var(--ha-border);
    }

    .top-nav a {
      display: inline-flex;
      color: var(--ha-text-muted);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .top-nav a:hover {
      color: var(--ha-primary);
    }

    .top-nav svg.feather {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .top-nav svg.mdi-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const ROOMS = ['Living Room', 'Kitchen', 'Bedroom', 'Office', 'Bathroom'];

    const SLOT_COUNT = 48;
    const LAST_SLOT = SLOT_COUNT - 1;

    // Night setback (00:00-06:00 and 22:00-24:00) + a warmer daytime band -
    // gives every preset real time variation out of the box, instead of one
    // flat value for the whole day.
    const buildDayNightPreset = (nightMin, nightMax, dayMin, dayMax) =>
      Array.from({ length: SLOT_COUNT }, (_, slot) => {
        const hour = slot / 2;
        const isNight = hour < 6 || hour >= 22;
        return isNight
          ? { temp_min: nightMin, temp_max: nightMax }
          : { temp_min: dayMin, temp_max: dayMax };
      });

    const DEFAULT_PRESETS = {
      Standard: buildDayNightPreset(16, 20, 18, 22),
      Economy: buildDayNightPreset(15, 19, 17, 21),
      Comfort: buildDayNightPreset(17, 21, 19, 23),
      Luxury: buildDayNightPreset(18, 22, 20, 24),
    };

    const SVG_WIDTH = 1000;
    const SVG_HEIGHT = 400;

    const leftPadding = 0;
    const rightPadding = 0;
    const topPadding = 20;
    const bottomPadding = 34;

    const TEMP_MIN = 10;
    const TEMP_MAX = 25;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const roundToHalf = (value) => Math.round(value * 2) / 2;

    const formatSlotTime = (slot) => {
      const hour = Math.floor(slot / 2);
      const minutes = slot % 2 === 0 ? '00' : '30';
      return `${String(hour).padStart(2, '0')}:${minutes}`;
    };

    const duplicate24To48 = (items) => {
      return items.flatMap((item) => [item, item].map((x) => ({ ...x })));
    };

    const ensurePresetLength = (preset) => {
      if (!Array.isArray(preset)) return DEFAULT_PRESETS.Standard.map((x) => ({ ...x }));

      if (preset.length === SLOT_COUNT) {
        return preset.map((x) => ({
          temp_min: x.temp_min,
          temp_max: x.temp_max,
        }));
      }

      if (preset.length === 24) {
        return duplicate24To48(
          preset.map((x) => ({
            temp_min: x.temp_min,
            temp_max: x.temp_max,
          }))
        );
      }

      return DEFAULT_PRESETS.Standard.map((x) => ({ ...x }));
    };

    const ensureScheduleLength = (schedule, forecast) => {
      if (!Array.isArray(schedule)) {
        return Array.from({ length: SLOT_COUNT }, (_, slot) => ({
          slot,
          temp_min: 18,
          temp_max: 22,
          forecast: forecast[slot],
          modified: false,
        }));
      }

      if (schedule.length === SLOT_COUNT) {
        return schedule.map((x, slot) => ({
          slot,
          temp_min: x.temp_min,
          temp_max: x.temp_max,
          forecast: forecast[slot],
          modified: Boolean(x.modified),
        }));
      }

      if (schedule.length === 24) {
        const expanded = duplicate24To48(schedule);
        return expanded.map((x, slot) => ({
          slot,
          temp_min: x.temp_min,
          temp_max: x.temp_max,
          forecast: forecast[slot],
          modified: Boolean(x.modified),
        }));
      }

      return Array.from({ length: SLOT_COUNT }, (_, slot) => ({
        slot,
        temp_min: 18,
        temp_max: 22,
        forecast: forecast[slot],
        modified: false,
      }));
    };

    const cloneScheduleFromPreset = (preset, forecast) => {
      const safePreset = ensurePresetLength(preset);
      return Array.from({ length: SLOT_COUNT }, (_, slot) => ({
        slot,
        temp_min: safePreset[slot].temp_min,
        temp_max: safePreset[slot].temp_max,
        forecast: forecast[slot],
        modified: false,
      }));
    };

    const normalizeScheduleForCompare = (schedule) => {
      return JSON.stringify(
        (schedule || []).map((h) => ({
          temp_min: Number(h.temp_min.toFixed(2)),
          temp_max: Number(h.temp_max.toFixed(2)),
        }))
      );
    };

    const getSegmentsFromSchedule = (schedule) => {
      if (!schedule || schedule.length === 0) return [];

      const segments = [];
      let startSlot = 0;
      let currentMin = schedule[0].temp_min;
      let currentMax = schedule[0].temp_max;

      for (let i = 1; i < schedule.length; i++) {
        const changed =
          schedule[i].temp_min !== currentMin ||
          schedule[i].temp_max !== currentMax;

        if (changed) {
          segments.push({
            startSlot,
            endSlot: i - 1,
            temp_min: currentMin,
            temp_max: currentMax,
          });
          startSlot = i;
          currentMin = schedule[i].temp_min;
          currentMax = schedule[i].temp_max;
        }
      }

      segments.push({
        startSlot,
        endSlot: LAST_SLOT,
        temp_min: currentMin,
        temp_max: currentMax,
      });

      return segments;
    };

    const buildScheduleFromSegments = (segments, forecast, previousSchedule = []) => {
      const next = [];

      segments.forEach((segment) => {
        for (let slot = segment.startSlot; slot <= segment.endSlot; slot++) {
          next.push({
            slot,
            temp_min: segment.temp_min,
            temp_max: segment.temp_max,
            forecast: forecast[slot],
            modified: segment.modified ?? previousSchedule[slot]?.modified ?? true,
          });
        }
      });

      return next.sort((a, b) => a.slot - b.slot);
    };

    // Segments are the source of truth for editing (see ThermalComfortUI_Advanced's
    // weekSchedule state) - each one needs a stable id, independent of its
    // temp_min/temp_max values, so a split/merge/drag can be tracked and
    // survives a re-render even when two adjacent segments happen to share
    // the same temperature (getSegmentsFromSchedule alone can't tell those
    // apart - it only ever sees a flat list of per-slot values).
    let segmentIdCounter = 0;
    const makeSegmentId = () => `seg-${segmentIdCounter++}`;

    const segmentsWithIds = (segments) =>
      segments.map((seg) => ({ ...seg, id: seg.id || makeSegmentId(), modified: Boolean(seg.modified) }));

    const scheduleToSegments = (schedule) => segmentsWithIds(getSegmentsFromSchedule(schedule));

    const ThermalComfortUI_Advanced = () => {
      const [currentDay, setCurrentDay] = useState(0);
      const [currentRoom, setCurrentRoom] = useState(0);
      const [rooms, setRooms] = useState(ROOMS);
      const [weekSchedule, setWeekSchedule] = useState({});
      const [mockForecast, setMockForecast] = useState([]);
      const [dragging, setDragging] = useState(null);
      const [loading, setLoading] = useState(true);
      const [presets, setPresets] = useState(DEFAULT_PRESETS);
      const [presetDraftNames, setPresetDraftNames] = useState({});
      const [selectedPresetName, setSelectedPresetName] = useState('Standard');
      const svgRef = useRef(null);
      const timelineTrackRef = useRef(null);
      const [timelineDrag, setTimelineDrag] = useState(null);
      // Manual double-tap tracking for touchscreens: native dblclick doesn't
      // fire reliably from a double-tap on most mobile browsers, so this
      // pairs up two touchend events by time+distance instead. Also used to
      // suppress a synthesized mouse dblclick some browsers fire right after
      // a touch double-tap, so a single physical double-tap can't split/merge twice.
      const lastTapRef = useRef({ time: 0, x: 0, y: 0 });
      const suppressNextDblClickRef = useRef(false);

      useEffect(() => {
        const init = async () => {
          const mock = Array.from({ length: SLOT_COUNT }, (_, i) =>
            18 + Math.sin((i / SLOT_COUNT) * Math.PI * 2) * 2
          );
          setMockForecast(mock);

          // Load room names from EMHASS config (heatpump_room_names), fall back to defaults
          let configRooms = ROOMS;
          try {
            const response = await fetch('/get-config');
            if (response.ok) {
              const config = await response.json();
              const names = config?.heatpump_room_names;
              if (Array.isArray(names) && names.length > 0) {
                const filtered = names.map(n => String(n).trim()).filter(n => n !== '');
                if (filtered.length > 0) configRooms = filtered;
              }
            }
          } catch (e) {
            console.warn('Could not load room names from config, using defaults', e);
          }
          setRooms(configRooms);

          // Try the server-persisted schedule/presets first (survives across
          // browsers/devices); fall back to localStorage if the server has
          // nothing saved yet or the request fails (e.g. offline dev server).
          let serverData = null;
          try {
            const scheduleResponse = await fetch('/room-schedule');
            if (scheduleResponse.ok) {
              const parsed = await scheduleResponse.json();
              const hasSchedule = parsed && Object.keys(parsed.weekSchedule || {}).length > 0;
              const hasPresets = parsed && Object.keys(parsed.presets || {}).length > 0;
              if (hasSchedule || hasPresets) {
                serverData = parsed;
              }
            }
          } catch (e) {
            console.warn('Could not load schedule from server, falling back to localStorage', e);
          }

          let savedPresets = DEFAULT_PRESETS;
          const rawPresets = serverData?.presets && Object.keys(serverData.presets).length > 0
            ? JSON.stringify(serverData.presets)
            : localStorage.getItem('thermalPresets');
          if (rawPresets) {
            try {
              const parsed = JSON.parse(rawPresets);
              if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
                const normalized = {};
                Object.entries(parsed).forEach(([name, preset]) => {
                  normalized[name] = ensurePresetLength(preset);
                });
                savedPresets = normalized;
              }
            } catch (e) {
              console.error('Failed to load presets', e);
            }
          }

          setPresets(savedPresets);
          setPresetDraftNames(
            Object.keys(savedPresets).reduce((acc, key) => {
              acc[key] = key;
              return acc;
            }, {})
          );
          setSelectedPresetName(savedPresets.Standard ? 'Standard' : Object.keys(savedPresets)[0]);

          const forecastForRoom = (roomIndex) =>
            mock.map((value, slot) => value + roomIndex * 0.25 + Math.sin((slot / SLOT_COUNT) * Math.PI) * 0.15);

          // weekSchedule state holds SEGMENTS (see scheduleToSegments) - that's
          // the editable source of truth. The server/localStorage payload
          // itself stays a flat per-slot array (unchanged wire format), only
          // converted to segments once here, right after loading.
          const defaultWeekSchedule = {};
          DAYS.forEach((day) => {
            defaultWeekSchedule[day] = {};
            configRooms.forEach((room, roomIndex) => {
              defaultWeekSchedule[day][room] = scheduleToSegments(
                cloneScheduleFromPreset(
                  savedPresets.Standard || Object.values(savedPresets)[0],
                  forecastForRoom(roomIndex)
                )
              );
            });
          });

          let finalSchedule = defaultWeekSchedule;
          const savedSchedule = serverData?.weekSchedule && Object.keys(serverData.weekSchedule).length > 0
            ? JSON.stringify(serverData.weekSchedule)
            : localStorage.getItem('weekSchedule');

          if (savedSchedule) {
            try {
              const parsed = JSON.parse(savedSchedule);
              if (parsed && typeof parsed === 'object') {
                const normalized = {};
                DAYS.forEach((day) => {
                  normalized[day] = {};
                  configRooms.forEach((room, roomIndex) => {
                    normalized[day][room] = scheduleToSegments(
                      ensureScheduleLength(parsed?.[day]?.[room], forecastForRoom(roomIndex))
                    );
                  });
                });
                finalSchedule = normalized;
              }
            } catch (e) {
              console.error('Failed to load schedule', e);
            }
          }

          setWeekSchedule(finalSchedule);
          setLoading(false);
        };
        init();
      }, []);

      useEffect(() => {
        if (!loading) {
          localStorage.setItem('thermalPresets', JSON.stringify(presets));
        }
      }, [presets, loading]);

      const currentDayName = DAYS[currentDay];
      const currentRoomName = rooms[currentRoom] || rooms[0];
      // The editable source of truth: explicit segments (id + startSlot/endSlot
      // + temp_min/temp_max), never re-derived from values - see scheduleToSegments.
      const currentSegments = weekSchedule?.[currentDayName]?.[currentRoomName] || [];

      const roomForecast = mockForecast.map((value, slot) => value + currentRoom * 0.25 + Math.sin((slot / SLOT_COUNT) * Math.PI) * 0.15);

      // Flat per-slot view, derived fresh from currentSegments every render -
      // used for chart rendering (the polyline needs one point per slot) and
      // anywhere else that wants "what's the value at slot N" rather than
      // "which blocks exist". Never stored, never the thing edited directly.
      const currentSchedule = buildScheduleFromSegments(currentSegments, roomForecast);

      const persistScheduleToServer = (payload) => {
        fetch('/room-schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        }).catch((e) => {
          console.warn('Could not save schedule to server, kept in localStorage only', e);
        });
      };

      // weekSchedule (segments) never leaves the browser as-is: the server/
      // localStorage payload stays the original flat per-slot shape (so the
      // backend's room-schedule consumer doesn't need to change), built by
      // flattening every day/room's segments right before saving.
      const flattenWeekSchedule = (weekSegments) => {
        const flat = {};
        DAYS.forEach((day) => {
          flat[day] = {};
          rooms.forEach((room, roomIndex) => {
            const segs = weekSegments?.[day]?.[room] || [];
            const forecast = mockForecast.map(
              (value, slot) => value + roomIndex * 0.25 + Math.sin((slot / SLOT_COUNT) * Math.PI) * 0.15
            );
            flat[day][room] = buildScheduleFromSegments(segs, forecast);
          });
        });
        return flat;
      };

      const saveWeekToStorage = (weekSegments) => {
        const flat = flattenWeekSchedule(weekSegments);
        localStorage.setItem('weekSchedule', JSON.stringify(flat));
        persistScheduleToServer({ weekSchedule: flat, presets });
      };

      const savePresetsToStorage = (nextPresets) => {
        localStorage.setItem('thermalPresets', JSON.stringify(nextPresets));
        persistScheduleToServer({ weekSchedule, presets: nextPresets });
      };

      const chartWidth = SVG_WIDTH - leftPadding - rightPadding;
      const chartHeight = SVG_HEIGHT - topPadding - bottomPadding;
      const timelineInsetPx = 16;
      const timelineLeftPct = ((leftPadding + timelineInsetPx) / SVG_WIDTH) * 100;
      const timelineRightPct = ((rightPadding + timelineInsetPx) / SVG_WIDTH) * 100;

      const xForSlot = (slot) => leftPadding + (slot / LAST_SLOT) * chartWidth;

      const yForTemp = (temp) =>
        topPadding + ((TEMP_MAX - temp) / (TEMP_MAX - TEMP_MIN)) * chartHeight;

      const tempFromY = (y) => {
        const normalized = (y - topPadding) / chartHeight;
        const temp = TEMP_MAX - normalized * (TEMP_MAX - TEMP_MIN);
        return clamp(temp, TEMP_MIN, TEMP_MAX);
      };

      const svgPointFromEvent = (e) => {
        const svg = svgRef.current;
        if (!svg) return null;

        const pt = svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;

        const ctm = svg.getScreenCTM();
        if (!ctm) return null;

        return pt.matrixTransform(ctm.inverse());
      };

      const getMatchedPresetName = (schedule) => {
        const target = normalizeScheduleForCompare(schedule);
        for (const [presetName, preset] of Object.entries(presets)) {
          const presetAsSchedule = ensurePresetLength(preset).map((h, slot) => ({
            slot,
            temp_min: h.temp_min,
            temp_max: h.temp_max,
          }));
          if (normalizeScheduleForCompare(presetAsSchedule) === target) {
            return presetName;
          }
        }
        return null;
      };

      const currentPresetName = getMatchedPresetName(currentSchedule);

      const updateCurrentRoomSegments = (newSegments) => {
        const updatedWeek = {
          ...weekSchedule,
          [currentDayName]: {
            ...weekSchedule[currentDayName],
            [currentRoomName]: newSegments,
          },
        };
        setWeekSchedule(updatedWeek);
        saveWeekToStorage(updatedWeek);
      };

      const handleMouseDown = (e) => {
        if (!svgRef.current || currentSchedule.length === 0) return;

        const point = svgPointFromEvent(e);
        if (!point) return;

        const x = clamp(point.x, leftPadding, leftPadding + chartWidth);
        const y = point.y;

        const slotX = Math.round(((x - leftPadding) / chartWidth) * LAST_SLOT);
        if (slotX < 0 || slotX > LAST_SLOT) return;

        const clickedTemp = tempFromY(y);
        const current = currentSchedule[slotX];
        if (!current) return;

        const distToMin = Math.abs(clickedTemp - current.temp_min);
        const distToMax = Math.abs(clickedTemp - current.temp_max);
        const type = distToMin < distToMax ? 'min' : 'max';

        const selectedValue = type === 'min' ? current.temp_min : current.temp_max;

        const segment = currentSegments.find((seg) => slotX >= seg.startSlot && slotX <= seg.endSlot);
        if (!segment) return;

        setDragging({
          segmentId: segment.id,
          type,
          startY: point.y,
        });
      };

      const handleMouseMove = (e) => {
        if (!dragging || currentSegments.length === 0) return;

        const point = svgPointFromEvent(e);
        if (!point) return;

        const deltaY = dragging.startY - point.y;
        const tempChange = (deltaY / chartHeight) * (TEMP_MAX - TEMP_MIN);

        const nextSegments = currentSegments.map((seg) => {
          if (seg.id !== dragging.segmentId) return seg;

          const updated = { ...seg, modified: true };
          if (dragging.type === 'min') {
            updated.temp_min = roundToHalf(clamp(seg.temp_min + tempChange, TEMP_MIN, seg.temp_max));
          } else {
            updated.temp_max = roundToHalf(clamp(seg.temp_max + tempChange, seg.temp_min, TEMP_MAX));
          }
          return updated;
        });

        updateCurrentRoomSegments(nextSegments);
        setDragging({ ...dragging, startY: point.y });
      };

      const handleMouseUp = () => {
        setDragging(null);
      };

      useEffect(() => {
        if (!dragging) return;

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragging, currentSegments, weekSchedule, currentDay, currentRoom]);

      // How close (in slots) a double-click/tap has to land to an existing
      // boundary for it to count as "on" that boundary (merge) rather than
      // "inside" a segment (split). ~1 hour of slack either side.
      const BOUNDARY_HIT_SLOTS = 2;

      const slotFromClientPoint = (clientX, clientY) => {
        const svg = svgRef.current;
        if (!svg) return null;

        const pt = svg.createSVGPoint();
        pt.x = clientX;
        pt.y = clientY;

        const ctm = svg.getScreenCTM();
        if (!ctm) return null;

        const point = pt.matrixTransform(ctm.inverse());
        const x = clamp(point.x, leftPadding, leftPadding + chartWidth);
        const slot = Math.round(((x - leftPadding) / chartWidth) * LAST_SLOT);
        return clamp(slot, 0, LAST_SLOT);
      };

      // Double-click/double-tap on the chart splits the segment under the
      // cursor into two (both halves start with the segment's current
      // values - segments are explicit now, so this sticks even when the
      // two halves are momentarily identical, unlike the old value-derived
      // approach), or - if the double-click/tap lands on an existing
      // boundary - removes that boundary again, merging the two segments
      // it separated back into one.
      const performSplitOrMerge = (slotX) => {
        if (slotX === null || currentSegments.length === 0) return;

        const boundaryIndex = currentSegments.findIndex(
          (seg, idx) => idx > 0 && Math.abs(seg.startSlot - slotX) <= BOUNDARY_HIT_SLOTS
        );

        let nextSegments;
        if (boundaryIndex > 0) {
          // Merge: drop the boundary, extending the previous segment's
          // values (and window) over the one that followed it.
          nextSegments = currentSegments
            .filter((_, idx) => idx !== boundaryIndex)
            .map((seg, idx) => {
              if (idx !== boundaryIndex - 1) return seg;
              const removed = currentSegments[boundaryIndex];
              return { ...seg, endSlot: removed.endSlot, modified: true };
            });
        } else {
          const segment = currentSegments.find((seg) => slotX >= seg.startSlot && slotX <= seg.endSlot);
          if (!segment || slotX <= segment.startSlot || slotX > segment.endSlot) return;

          nextSegments = [];
          currentSegments.forEach((seg) => {
            if (seg.id !== segment.id) {
              nextSegments.push(seg);
              return;
            }
            nextSegments.push({ ...seg, endSlot: slotX - 1, modified: true });
            nextSegments.push({ ...seg, id: makeSegmentId(), startSlot: slotX, modified: true });
          });
        }

        updateCurrentRoomSegments(nextSegments);
      };

      const handleChartDoubleClick = (e) => {
        if (suppressNextDblClickRef.current) {
          suppressNextDblClickRef.current = false;
          return;
        }
        performSplitOrMerge(slotFromClientPoint(e.clientX, e.clientY));
      };

      const DOUBLE_TAP_MS = 350;
      const DOUBLE_TAP_PX = 24;

      const handleChartTouchEnd = (e) => {
        const touch = e.changedTouches && e.changedTouches[0];
        if (!touch) return;

        const now = Date.now();
        const last = lastTapRef.current;
        const dx = touch.clientX - last.x;
        const dy = touch.clientY - last.y;
        const isDoubleTap =
          now - last.time < DOUBLE_TAP_MS && Math.sqrt(dx * dx + dy * dy) < DOUBLE_TAP_PX;

        if (isDoubleTap) {
          e.preventDefault();
          suppressNextDblClickRef.current = true;
          performSplitOrMerge(slotFromClientPoint(touch.clientX, touch.clientY));
          lastTapRef.current = { time: 0, x: 0, y: 0 };
        } else {
          lastTapRef.current = { time: now, x: touch.clientX, y: touch.clientY };
        }
      };

      const applyPreset = (presetName = selectedPresetName) => {
        const preset = presets[presetName];
        if (!preset || roomForecast.length === 0) return;
        updateCurrentRoomSegments(scheduleToSegments(cloneScheduleFromPreset(preset, roomForecast)));
      };

      const overwritePresetWithCurrentRoom = (presetName = selectedPresetName) => {
        if (!currentSchedule.length) return;

        const nextPresets = {
          ...presets,
          [presetName]: currentSchedule.map((h) => ({
            temp_min: h.temp_min,
            temp_max: h.temp_max,
          })),
        };

        setPresets(nextPresets);
        savePresetsToStorage(nextPresets);
        alert(`Preset "${presetName}" updated from ${currentRoomName}.`);
      };

      const applyToAllDays = () => {
        if (currentSegments.length === 0) return;

        const updatedWeek = { ...weekSchedule };
        DAYS.forEach((day) => {
          updatedWeek[day] = {
            ...updatedWeek[day],
            // Fresh ids per day - these are independent copies, never
            // dragged/split in lockstep, so they shouldn't share identity.
            [currentRoomName]: currentSegments.map((seg) => ({ ...seg, id: makeSegmentId() })),
          };
        });

        setWeekSchedule(updatedWeek);
        saveWeekToStorage(updatedWeek);
        alert(`Applied ${currentRoomName} schedule to all days.`);
      };

      const exportSchedule = () => {
        const dataStr = JSON.stringify(
          {
            presets,
            weekSchedule: flattenWeekSchedule(weekSchedule),
          },
          null,
          2
        );
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `thermal_schedule_${currentDayName}_${currentRoomName.replace(/\s+/g, '_')}.json`;
        link.click();
        URL.revokeObjectURL(url);
      };

      const resetRoom = () => {
        const fallbackPresetName = Object.keys(presets)[0];
        const basePreset = presets.Standard || presets[fallbackPresetName];
        updateCurrentRoomSegments(scheduleToSegments(cloneScheduleFromPreset(basePreset, roomForecast)));
      };

      const saveCurrentRoomAsPreset = () => {
        const suggestedName = `${currentRoomName} Preset ${Object.keys(presets).length + 1}`;
        let finalName = suggestedName;
        let counter = 2;

        while (presets[finalName]) {
          finalName = `${suggestedName} (${counter})`;
          counter++;
        }

        const newPreset = currentSchedule.map((h) => ({
          temp_min: h.temp_min,
          temp_max: h.temp_max,
        }));

        const nextPresets = {
          ...presets,
          [finalName]: newPreset,
        };

        setPresets(nextPresets);
        setPresetDraftNames({
          ...presetDraftNames,
          [finalName]: finalName,
        });
        setSelectedPresetName(finalName);
        savePresetsToStorage(nextPresets);
      };

      const renamePreset = (oldName = selectedPresetName) => {
        const draft = (presetDraftNames[oldName] || '').trim();
        if (!draft || draft === oldName) return;

        if (presets[draft]) {
          alert('A preset with this name already exists.');
          return;
        }

        const nextPresets = {};
        Object.entries(presets).forEach(([name, value]) => {
          nextPresets[name === oldName ? draft : name] = value;
        });

        const nextDrafts = {};
        Object.keys(nextPresets).forEach((name) => {
          if (name === draft) {
            nextDrafts[name] = draft;
          } else {
            nextDrafts[name] = presetDraftNames[name] || name;
          }
        });

        setPresets(nextPresets);
        setPresetDraftNames(nextDrafts);
        setSelectedPresetName(draft);
        savePresetsToStorage(nextPresets);
      };

      const deletePreset = (presetName = selectedPresetName) => {
        const presetNames = Object.keys(presets);
        if (presetNames.length <= 1) {
          alert('At least one preset must remain.');
          return;
        }

        const nextPresets = { ...presets };
        delete nextPresets[presetName];

        const nextDrafts = { ...presetDraftNames };
        delete nextDrafts[presetName];

        setPresets(nextPresets);
        setPresetDraftNames(nextDrafts);
        setSelectedPresetName(Object.keys(nextPresets)[0]);
        savePresetsToStorage(nextPresets);
      };

      const displaySegments = currentSegments;

      const pointSlots = new Set();
      displaySegments.forEach((segment) => {
        pointSlots.add(segment.startSlot);
        pointSlots.add(segment.endSlot);
      });

      const updateChangePointTemperature = (segmentIndex, field, rawValue) => {
        const parsed = parseFloat(rawValue);
        if (Number.isNaN(parsed)) return;

        const segment = currentSegments[segmentIndex];
        if (!segment) return;

        const desired = roundToHalf(clamp(parsed, TEMP_MIN, TEMP_MAX));

        const nextSegments = currentSegments.map((seg, idx) => {
          if (idx !== segmentIndex) return seg;

          const updated = { ...seg, modified: true };
          if (field === 'temp_min') {
            updated.temp_min = clamp(desired, TEMP_MIN, updated.temp_max);
          } else {
            updated.temp_max = clamp(desired, updated.temp_min, TEMP_MAX);
          }
          return updated;
        });

        updateCurrentRoomSegments(nextSegments);
      };

      const updateChangePointTimeByStep = (segmentIndex, direction) => {
        if (segmentIndex <= 0 || segmentIndex >= currentSegments.length) return;

        const target = currentSegments[segmentIndex].startSlot + direction;
        updateChangePointTimeToSlot(segmentIndex, target);
      };

      const updateChangePointTimeToSlot = (segmentIndex, targetStartSlot) => {
        if (segmentIndex <= 0 || segmentIndex >= currentSegments.length) return;

        const prev = currentSegments[segmentIndex - 1];
        const current = currentSegments[segmentIndex];
        const next = currentSegments[segmentIndex + 1];

        const minStart = prev.startSlot + 1;
        const maxStart = next ? next.startSlot - 1 : LAST_SLOT;

        const newStart = clamp(targetStartSlot, minStart, maxStart);
        if (newStart === current.startSlot) return;

        const nextSegments = currentSegments.map((seg) => ({ ...seg }));
        nextSegments[segmentIndex - 1] = { ...nextSegments[segmentIndex - 1], endSlot: newStart - 1, modified: true };
        nextSegments[segmentIndex] = { ...nextSegments[segmentIndex], startSlot: newStart, modified: true };

        updateCurrentRoomSegments(nextSegments);
      };

      const startTimelineDrag = (e, segmentIndex, startSlot) => {
        if (segmentIndex === 0) return;
        e.preventDefault();
        setTimelineDrag({
          segmentIndex,
          startX: e.clientX,
          initialStartSlot: startSlot,
        });
      };

      useEffect(() => {
        if (!timelineDrag) return;

        const onMove = (e) => {
          const lane = timelineTrackRef.current?.querySelector('[data-timeline-lane="true"]');
          if (!lane) return;
          const rect = lane.getBoundingClientRect();
          if (!rect.width) return;

          const deltaSlots = Math.round(((e.clientX - timelineDrag.startX) / rect.width) * SLOT_COUNT);
          const nextStart = timelineDrag.initialStartSlot + deltaSlots;
          updateChangePointTimeToSlot(timelineDrag.segmentIndex, nextStart);
        };

        const onUp = () => setTimelineDrag(null);

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
      }, [timelineDrag, currentSegments, weekSchedule, currentDay, currentRoom]);

      // Dragging a segment boundary directly on the chart (the dashed
      // vertical line) - reuses updateChangePointTimeToSlot's existing
      // clamping (can't cross a neighboring boundary), just driven by chart
      // x-position instead of the separate timeline strip below. Pointer
      // Events (not mouse/touch handlers) so mouse, touch and stylus all go
      // through one code path.
      const [chartBoundaryDrag, setChartBoundaryDrag] = useState(null);

      const startChartBoundaryDrag = (e, segmentIndex) => {
        e.stopPropagation();
        e.preventDefault();
        setChartBoundaryDrag({ segmentIndex });
      };

      useEffect(() => {
        if (!chartBoundaryDrag) return;

        const onMove = (e) => {
          const slot = slotFromClientPoint(e.clientX, e.clientY);
          if (slot === null) return;
          updateChangePointTimeToSlot(chartBoundaryDrag.segmentIndex, slot);
        };
        const onUp = () => setChartBoundaryDrag(null);

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);

        return () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
        };
      }, [chartBoundaryDrag, currentSegments, weekSchedule, currentDay, currentRoom]);

      if (loading) {
        return <div style={styles.loading}>Loading...</div>;
      }

      return (
        <div style={styles.container}>
          <nav className="top-nav">
            <a href="index" title="Home">
              <svg className="feather">
                <use className="feather" href="static/img/feather-sprite.svg#home" />
              </svg>
            </a>
            <a href="configuration" title="Configuration">
              <svg className="feather">
                <use className="feather" href="static/img/feather-sprite.svg#settings" />
              </svg>
            </a>
            <a href="https://emhass.readthedocs.io/en/latest/" title="EMHASS Docs">
              <svg className="feather">
                <use className="feather" href="static/img/feather-sprite.svg#book" />
              </svg>
            </a>
            <a href="https://github.com/davidusb-geek/emhass" target="_blank" rel="noopener noreferrer" title="EMHASS Git repo">
              <svg className="feather">
                <use className="feather" href="static/img/feather-sprite.svg#git-branch" />
              </svg>
            </a>
          </nav>
          <header style={styles.header}>
            <div>
              <h1 style={styles.title}>Thermal Comfort</h1>
              <div style={styles.headerSubline}>
                Day: <strong>{currentDayName}</strong>
                <span style={styles.activeRoomBadge}>Room: {currentRoomName}</span>
                {currentPresetName ? (
                  <span style={styles.activePresetBadge}>Preset: {currentPresetName}</span>
                ) : (
                  <span style={styles.activePresetBadgeMuted}>Custom</span>
                )}
              </div>
            </div>

            <div style={styles.buttonGroup}>
              <button onClick={saveCurrentRoomAsPreset} style={{ ...styles.btn, ...styles.btnPrimary }}>
                Save as New Preset
              </button>
              <button onClick={exportSchedule} style={{ ...styles.btn, ...styles.btnSecondary }}>
                Export
              </button>
            </div>
          </header>

          <div style={styles.roomTabsWrap}>
            {rooms.map((room, idx) => (
              <button
                key={room}
                onClick={() => setCurrentRoom(idx)}
                style={{
                  ...styles.roomTab,
                  ...(currentRoom === idx ? styles.roomTabActive : {}),
                }}
              >
                {room}
              </button>
            ))}
          </div>

          <div style={styles.section}>
            <h2 style={styles.sectionTitle}>Presets for {currentDayName} · {currentRoomName}</h2>
            <div style={styles.presets}>
              {Object.keys(presets).map((presetName) => (
                <button
                  key={presetName}
                  onClick={() => applyPreset(presetName)}
                  style={{
                    ...styles.presetBtn,
                    ...(currentPresetName === presetName ? styles.presetBtnActive : {})
                  }}
                >
                  {presetName}
                </button>
              ))}
              <button onClick={applyToAllDays} style={{ ...styles.presetBtn, background: '#7c3aed' }}>
                Copy to All Days
              </button>
              <button onClick={resetRoom} style={{ ...styles.presetBtn, background: '#f59e0b' }}>
                Reset Room
              </button>
            </div>
          </div>

          <div style={styles.section}>
            <h2 style={styles.sectionTitle}>Temperature Profile</h2>
            <p style={styles.hint}>
              Alleen change points hebben bolletjes. Slepen werkt nog steeds op het profiel.
              Dubbelklik (of dubbeltik) ergens in een vak om het te splitsen in twee tijdvakken;
              dubbelklik/dubbeltik op een bestaande scheidingslijn om die weer op te heffen.
            </p>

            <svg
              ref={svgRef}
              width="100%"
              height={SVG_HEIGHT}
              viewBox={`0 0 ${SVG_WIDTH} ${SVG_HEIGHT}`}
              style={{ ...styles.svg, cursor: dragging ? 'grabbing' : 'grab', touchAction: 'manipulation' }}
              onMouseDown={handleMouseDown}
              onDoubleClick={handleChartDoubleClick}
              onTouchEnd={handleChartTouchEnd}
            >
              <rect width={SVG_WIDTH} height={SVG_HEIGHT} fill="#ffffff" />

              {[15, 17, 19, 21, 23, 25].map((temp) => (
                <g key={`grid-${temp}`}>
                  <line
                    x1={leftPadding}
                    y1={yForTemp(temp)}
                    x2={leftPadding + chartWidth}
                    y2={yForTemp(temp)}
                    stroke="#e5e7eb"
                    strokeDasharray="4,4"
                    strokeWidth="1"
                  />
                  <text
                    x={Math.max(8, leftPadding + 8)}
                    y={yForTemp(temp) + 5}
                    fontSize="11"
                    fill="#6b7280"
                    textAnchor="start"
                  >
                    {temp}°
                  </text>
                </g>
              ))}

              {currentSegments.map((segment, idx) => {
                if (idx === 0) return null; // slot 0 isn't a boundary, it's the start of the day
                const x = xForSlot(segment.startSlot);
                const isDraggingThis = chartBoundaryDrag && chartBoundaryDrag.segmentIndex === idx;
                return (
                  <g key={`segment-boundary-${segment.id}`}>
                    <line
                      x1={x}
                      y1={topPadding}
                      x2={x}
                      y2={topPadding + chartHeight}
                      stroke="#7c3aed"
                      strokeWidth={isDraggingThis ? '3' : '2'}
                      strokeDasharray="6,4"
                      opacity={isDraggingThis ? '0.9' : '0.55'}
                      pointerEvents="none"
                    />
                    {/* Wide, invisible hit-area so the boundary is easy to
                        grab (especially on touch) without needing pixel-
                        perfect accuracy on the thin dashed line above. */}
                    <line
                      x1={x}
                      y1={topPadding}
                      x2={x}
                      y2={topPadding + chartHeight}
                      stroke="transparent"
                      strokeWidth="24"
                      style={{ cursor: 'ew-resize', touchAction: 'none' }}
                      onPointerDown={(e) => startChartBoundaryDrag(e, idx)}
                    />
                  </g>
                );
              })}

              {currentSchedule.length > 0 && (
                <>
                  <path
                    d={[
                      `M ${xForSlot(0)} ${yForTemp(currentSchedule[0].temp_min)}`,
                      ...currentSchedule.map((h, i) => `L ${xForSlot(i)} ${yForTemp(h.temp_min)}`),
                      `L ${xForSlot(LAST_SLOT)} ${yForTemp(currentSchedule[LAST_SLOT].temp_max)}`,
                      ...currentSchedule.slice().reverse().map((h, i) => {
                        const idx = LAST_SLOT - i;
                        return `L ${xForSlot(idx)} ${yForTemp(h.temp_max)}`;
                      }),
                      'Z',
                    ].join(' ')}
                    fill="#03a9f4"
                    fillOpacity="0.10"
                  />

                  <polyline
                    points={currentSchedule.map((h, i) => `${xForSlot(i)},${yForTemp(h.temp_min)}`).join(' ')}
                    fill="none"
                    stroke="#2196f3"
                    strokeWidth="3"
                    strokeLinejoin="round"
                  />

                  <polyline
                    points={currentSchedule.map((h, i) => `${xForSlot(i)},${yForTemp(h.temp_max)}`).join(' ')}
                    fill="none"
                    stroke="#ef4444"
                    strokeWidth="3"
                    strokeLinejoin="round"
                  />

                  {currentSchedule.map((h, i) => {
                    if (!pointSlots.has(i)) return null;

                    const draggedSegment = dragging
                      ? currentSegments.find((seg) => seg.id === dragging.segmentId)
                      : null;
                    const isSelected =
                      draggedSegment &&
                      i >= draggedSegment.startSlot &&
                      i <= draggedSegment.endSlot;

                    return (
                      <g key={`points-${i}`}>
                        <circle
                          cx={xForSlot(i)}
                          cy={yForTemp(h.temp_min)}
                          r={isSelected && dragging.type === 'min' ? "8" : "6"}
                          fill="#2196f3"
                          stroke="white"
                          strokeWidth="2"
                          opacity={isSelected && dragging.type === 'min' ? 1 : 0.95}
                        />
                        <circle
                          cx={xForSlot(i)}
                          cy={yForTemp(h.temp_max)}
                          r={isSelected && dragging.type === 'max' ? "8" : "6"}
                          fill="#ef4444"
                          stroke="white"
                          strokeWidth="2"
                          opacity={isSelected && dragging.type === 'max' ? 1 : 0.95}
                        />
                      </g>
                    );
                  })}
                </>
              )}

              {[0, 6, 12, 18, 24, 30, 36, 42, 47].map((slot) => (
                <text
                  key={`slot-${slot}`}
                  x={xForSlot(slot)}
                  y={SVG_HEIGHT - 10}
                  fontSize="11"
                  fill="#4b5563"
                  textAnchor={slot === 0 ? 'start' : slot === LAST_SLOT ? 'end' : 'middle'}
                >
                  {formatSlotTime(slot)}
                </text>
              ))}
            </svg>

            <div style={styles.legend}>
              <div style={{ ...styles.legendItem, color: '#2196f3' }}>● Min</div>
              <div style={{ ...styles.legendItem, color: '#ef4444' }}>● Max</div>
            </div>
          </div>

          <div style={styles.section}>
            <h2 style={styles.sectionTitle}>Change Points</h2>
            <p style={styles.hint}>
              Sleep de tijd-balk bovenin elk vak om de starttijd te verschuiven. Temperatuur pas je per vak aan.
            </p>

            <div style={styles.timelineWrapper}>
              <div style={styles.timelineScale}>
                <div
                  style={{
                    ...styles.timelineScaleLane,
                    left: `${timelineLeftPct}%`,
                    right: `${timelineRightPct}%`,
                  }}
                >
                  {[0, 6, 12, 18, 24, 30, 36, 42, 48].map((slot) => (
                    <div
                      key={`timeline-label-${slot}`}
                      style={{
                        ...styles.timelineScaleLabel,
                        left: `${(slot / SLOT_COUNT) * 100}%`,
                      }}
                    >
                      {formatSlotTime(Math.min(slot, LAST_SLOT))}
                    </div>
                  ))}
                </div>
              </div>

              <div ref={timelineTrackRef} style={styles.timelineTrack}>
              <div
                data-timeline-lane="true"
                style={{
                  ...styles.timelineLane,
                  left: `${timelineLeftPct}%`,
                  right: `${timelineRightPct}%`,
                }}
              >
              {displaySegments.map((segment, idx) => {
                const isFirst = idx === 0;
                const duration = segment.endSlot - segment.startSlot + 1;
                const leftPct = (segment.startSlot / SLOT_COUNT) * 100;
                const widthPct = (duration / SLOT_COUNT) * 100;
                const isDraggingSegment = timelineDrag && timelineDrag.segmentIndex === idx;

                return (
                  <div
                    key={segment.id}
                    style={{
                      ...styles.timelineSegment,
                      ...(isDraggingSegment ? styles.timelineSegmentDragging : {}),
                      left: `${leftPct}%`,
                      width: `${widthPct}%`,
                    }}
                  >
                    <div style={styles.timelineSegmentHandle}>
                      <span style={styles.timelineSegmentTime}>🕒 {formatSlotTime(segment.startSlot)}</span>
                    </div>

                    <div style={styles.timelineSegmentBody}>
                      <div style={styles.tempInputWrap}>
                        <span style={styles.timelineTempLabel}>Max</span>
                        <input
                          type="number"
                          min={TEMP_MIN}
                          max={TEMP_MAX}
                          step="0.5"
                          value={segment.temp_max}
                          onChange={(e) => updateChangePointTemperature(idx, 'temp_max', e.target.value)}
                          style={styles.changeInputWithSuffix}
                        />
                        <span style={styles.inputSuffix}>°C</span>
                      </div>

                      <div style={styles.tempInputWrap}>
                        <span style={styles.timelineTempLabel}>Min</span>
                        <input
                          type="number"
                          min={TEMP_MIN}
                          max={TEMP_MAX}
                          step="0.5"
                          value={segment.temp_min}
                          onChange={(e) => updateChangePointTemperature(idx, 'temp_min', e.target.value)}
                          style={styles.changeInputWithSuffix}
                        />
                        <span style={styles.inputSuffix}>°C</span>
                      </div>
                    </div>
                  </div>
                );
              })}

              {displaySegments.map((segment, idx) => {
                if (idx === 0) return null;

                const leftPct = (segment.startSlot / SLOT_COUNT) * 100;
                const isActive = timelineDrag && timelineDrag.segmentIndex === idx;

                return (
                  <div
                    key={`boundary-${segment.id}`}
                    style={{
                      ...styles.timelineBoundary,
                      ...(isActive ? styles.timelineBoundaryActive : {}),
                      left: `${leftPct}%`,
                    }}
                    onMouseDown={(e) => startTimelineDrag(e, idx, segment.startSlot)}
                    title="Sleep om scheidingstijd te wijzigen"
                  >
                    <div style={styles.timelineBoundaryKnob} />
                  </div>
                );
              })}
              </div>
              </div>
            </div>
          </div>

          <div style={styles.section}>
            <h2 style={styles.sectionTitle}>Week Overview</h2>
            <div style={styles.weekGrid}>
              {DAYS.map((day, idx) => {
                const daySegments = weekSchedule?.[day]?.[currentRoomName] || [];
                const modified = daySegments.filter((seg) => seg?.modified).length;
                // Flatten to the per-slot view for anything that needs to
                // compare against a preset (also 48 slots) or wants a
                // duration-weighted average - a plain average over segments
                // would let a 2-hour night block skew the day average as
                // much as a 20-hour day block.
                const daySchedule = buildScheduleFromSegments(daySegments, mockForecast);
                const matchedPreset = getMatchedPresetName(daySchedule);

                const avgMin = daySchedule.length
                  ? daySchedule.reduce((s, h) => s + h.temp_min, 0) / daySchedule.length
                  : 0;

                const avgMax = daySchedule.length
                  ? daySchedule.reduce((s, h) => s + h.temp_max, 0) / daySchedule.length
                  : 0;

                return (
                  <button
                    key={day}
                    onClick={() => setCurrentDay(idx)}
                    style={{
                      ...styles.weekCard,
                      ...(currentDay === idx ? styles.weekCardActive : {})
                    }}
                  >
                    <div style={styles.weekCardTitle}>{day}</div>
                    <div style={styles.weekCardStat}>
                      {avgMin.toFixed(1)}° - {avgMax.toFixed(1)}°
                    </div>
                    <div style={styles.weekCardPreset}>
                      {matchedPreset ? `Preset: ${matchedPreset}` : 'Custom'}
                    </div>
                    <div style={styles.weekCardModified}>
                      {modified > 0 ? `${modified} modified` : 'No manual edits'}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          <div style={styles.section}>
            <h2 style={styles.sectionTitle}>Manage Presets</h2>
            <p style={styles.hint}>
              Selecteer hieronder een preset en gebruik daarna de gedeelde knoppen.
            </p>

            <div style={styles.presetManagerChips}>
              {Object.keys(presets).map((presetName) => (
                <button
                  key={presetName}
                  onClick={() => setSelectedPresetName(presetName)}
                  style={{
                    ...styles.presetChip,
                    ...(selectedPresetName === presetName ? styles.presetChipActive : {}),
                  }}
                >
                  {presetName}
                </button>
              ))}
            </div>

            <div style={styles.presetSharedActions}>
              <input
                value={presetDraftNames[selectedPresetName] || selectedPresetName || ''}
                onChange={(e) =>
                  setPresetDraftNames({
                    ...presetDraftNames,
                    [selectedPresetName]: e.target.value,
                  })
                }
                style={styles.presetNameInput}
              />
              <button
                onClick={() => renamePreset()}
                style={{ ...styles.smallBtn, ...styles.smallBtnPrimary }}
              >
                Rename
              </button>
              <button
                onClick={() => applyPreset()}
                style={{ ...styles.smallBtn, ...styles.smallBtnSecondary }}
              >
                Apply
              </button>
              <button
                onClick={() => overwritePresetWithCurrentRoom()}
                style={{ ...styles.smallBtn, ...styles.smallBtnOverwrite }}
              >
                Save Current
              </button>
              <button
                onClick={() => deletePreset()}
                style={{ ...styles.smallBtn, ...styles.smallBtnDanger }}
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      );
    };

    const styles = {
      container: {
        maxWidth: '1400px',
        margin: '0 auto',
        padding: '20px',
      },
      loading: {
        padding: '40px',
        textAlign: 'center',
        fontSize: '1.2em',
        color: '#374151',
      },
      header: {
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        marginBottom: '24px',
        gap: '20px',
        flexWrap: 'wrap',
      },
      title: {
        fontSize: '2rem',
        fontWeight: '700',
        color: '#1f2937',
      },
      headerSubline: {
        marginTop: '8px',
        display: 'flex',
        alignItems: 'center',
        gap: '10px',
        flexWrap: 'wrap',
        fontSize: '0.95em',
        color: '#4b5563',
